<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CaseClerk AI</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="assets/logo-mark.png" width="38" height="38" alt="" />
      <div>
        <div class="brand-title">CaseClerk <span class="brand-ai">AI</span></div>
        <div class="brand-sub">Ca mẫu: Đau đầu, yếu ½ người (T) · Nữ 52 tuổi</div>
      </div>
      <span class="specialty" id="specialty" title="Chuyên khoa đang dùng cho ca này">
        <span class="specialty-label">Chuyên khoa</span>
        <span class="specialty-name">Nội thần kinh</span>
      </span>
    </div>
    <div class="topbar-right">
      <span class="proto-tag">Bản thử · AI chưa kết nối</span>
      <div class="cost" title="Chi phí AI giả lập cho ca này">
        <span class="cost-label">Chi phí ca này</span>
        <span class="cost-value" id="cost">$0.000</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="steps" id="steps" aria-label="Các mục bệnh án"></nav>
    <main class="work" id="work" aria-live="polite"></main>
    <aside class="map" id="map" aria-label="Bản đồ lập luận"></aside>
  </div>

  <script src="data.js"></script>
  <script src="matrix.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
